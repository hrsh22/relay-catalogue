name: Verify Relay
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run contract:build
      - run: git diff --exit-code contracts/artifact.json src/lib/registry-abi.ts
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:secrets
      - run: npm run build
  fork-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run contract:build
      - run: npm run verify:fork
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-safe-rehearsal
          path: .runtime/fork-verification/
          if-no-files-found: error
